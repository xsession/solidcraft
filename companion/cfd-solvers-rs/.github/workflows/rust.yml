name: Native Rust numerical checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  native:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      RAYON_NUM_THREADS: 4
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Rust
        run: rustup toolchain install 1.85.1 --profile minimal --component rustfmt
      - run: cargo +1.85.1 fmt --all -- --check
      - run: cargo +1.85.1 test --offline --locked --all-features
      - run: cargo +1.85.1 build --offline --locked --release --all-features
      - run: python scripts/update_coverage.py --check
      - run: python scripts/validate_exports.py --binary target/release/cfd-solve
        if: runner.os == 'Linux'
  upstream-oracle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: xsession/cfd_solvers
          ref: 7cceaaaddafaf2515e01a86406e13d6037fdbf9a
          path: upstream
      - run: python scripts/regenerate_goldens.py --upstream upstream --check
      - run: python scripts/regenerate_goldens.py --upstream upstream --group fvm --check
